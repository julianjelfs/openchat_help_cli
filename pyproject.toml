[project]
name = "ocqa"
version = "0.1.0"
description = "Cited question answering over the OpenChat corpus"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "numpy>=1.26",
    "beautifulsoup4>=4.12",
    "openai>=1.60",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
eval-retrieval = "ocqa.evals.retrieval:main"
eval-answers = "ocqa.evals.answers:main"
serve-ocqa = "ocqa.service:main"
review-candidates = "ocqa.review:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
